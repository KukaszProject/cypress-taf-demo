name: Cypress E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3]
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install dependencies and Lint
        run: |
          npm ci
          npm run lint

      - name: Run Cypress Tests in Parallel
        uses: cypress-io/github-action@v6
        with:
          record: true
          parallel: true
          env: configFile=qa
        env:
          CYPRESS_SAUCE_PASSWORD: ${{ secrets.CYPRESS_SAUCE_PASSWORD }}
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}